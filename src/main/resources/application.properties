spring.application.name=rest-ms
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/api/v1/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v1/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}

app.keycloak.base-url=${KEYCLOAK_BASE_URL:}
app.keycloak.realm=${KEYCLOAK_REALM:}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
app.keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:}
app.keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

google.calendar.client-id=${GOOGLE_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
google.calendar.refresh-token=${GOOGLE_REFRESH_TOKEN}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:primary}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}

app.minio.endpoint=${MINIO_ENDPOINT:}
app.minio.access-key=${MINIO_ACCESS_KEY:}
app.minio.secret-key=${MINIO_SECRET_KEY:}
app.minio.bucket=${MINIO_BUCKET:com-rest-ms}
app.minio.region=${MINIO_REGION:}
app.minio.presigned-url-expiration-seconds=${MINIO_PRESIGNED_URL_EXPIRATION_SECONDS:300}
app.minio.create-bucket-if-missing=${MINIO_CREATE_BUCKET_IF_MISSING:true}

app.files.profNile-photo.max-size-bytes=${APP_FILES_PROFILE_PHOTO_MAX_SIZE_BYTES:5242880}
app.files.profile-photo.allowed-mime-types=${APP_FILES_PROFILE_PHOTO_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
app.files.odontogram.max-size-bytes=${APP_FILES_ODONTOGRAM_MAX_SIZE_BYTES:10485760}
app.files.odontogram.allowed-mime-types=${APP_FILES_ODONTOGRAM_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,application/pdf}
