spring.config.import=
spring.datasource.url=jdbc:h2:mem:rest_ms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/rest-ms
app.keycloak.base-url=http://localhost:8081
app.keycloak.realm=rest-ms
app.keycloak.client-id=rest-ms-api
app.keycloak.client-secret=rest-ms-api-secret
app.keycloak.admin-username=api-admin
app.keycloak.admin-password=api-admin123
spring.flyway.enabled=false

google.calendar.client-id=test-client-id
google.calendar.client-secret=test-client-secret
google.calendar.refresh-token=test-refresh-token
google.calendar.calendar-id=primary

app.minio.endpoint=http://localhost:9000
app.minio.access-key=test-access-key
app.minio.secret-key=test-secret-key
app.minio.bucket=test-bucket
app.minio.region=us-east-1
app.minio.presigned-url-expiration-seconds=300
app.minio.create-bucket-if-missing=false
app.files.profile-photo.max-size-bytes=5242880
app.files.profile-photo.allowed-mime-types=image/jpeg,image/png,image/webp
app.files.odontogram.max-size-bytes=10485760
app.files.odontogram.allowed-mime-types=image/jpeg,image/png,image/webp,application/pdf
